# Alembic 配置（DataForge 造数工厂）
# 数据库连接串不写死在此文件，由 alembic/env.py 从 app.config.settings 注入

[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件命名模板：{序号三位}_{功能描述}
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Shanghai

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
