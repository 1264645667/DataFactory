# ============================================================================
# DataForge 造数工厂 — Docker Compose 编排（生产/联调环境）
#
# 说明：
#   1. MySQL / Redis / Nacos 均使用公司外部实例（见 .env 中 EXTERNAL_* 变量），
#      本编排不再包含 mysql / nacos 容器，也不再使用项目内置 sql/init.sql。
#   2. 系统库 data_factory 需由 DBA 提前建好，账号需具备 DDL/DML 权限。
#   3. Redis 使用外部 172.28.31.239:6379 db=3，密码通过 REDIS_URL 注入。
#   4. Nacos 默认 localhost:8848（本地调试）；线上通过 NACOS_SERVER 指向真实地址。
#   5. Compose v2 已废弃 version 字段。
# ============================================================================

# ── 公共环境变量锚点（api / worker-high / worker-normal / beat 共用）────────
x-api-env: &api-env
  # 系统库连接串（SQLAlchemy + aiomysql 异步驱动；密码含特殊字符需 URL 编码）
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  # Nacos 配置中心 / 注册中心
  NACOS_SERVER: ${NACOS_SERVER:-localhost:8848}
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
  NACOS_GROUP: ${NACOS_GROUP:-datafactory_group}
  NACOS_DATA_ID: ${NACOS_DATA_ID:-popsicle_datafactory_config}
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  # 应用密钥
  SECRET_KEY: ${SECRET_KEY}
  AES_KEY: ${AES_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: Asia/Shanghai

services:

  # ── 数据库迁移（一次性：api/worker 启动前执行 alembic upgrade head）───────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    environment:
      <<: *api-env

  # ── 应用服务 ────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python:3.11-slim 无 curl，用 urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 2               # 默认 2 副本，可 --scale api=N 扩容
      resources:
        limits:
          memory: 1g

  worker-high:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 高优先级造数队列，8 线程并发
    command: celery -A app.celery_app worker -Q high -c 8 --loglevel=info
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2               # 造数压力大时可 --scale worker-high=N 扩容
      resources:
        limits:
          memory: 2g

  worker-normal:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 普通 + 低优先级队列（数据源同步、回滚、通知等后台任务）
    command: celery -A app.celery_app worker -Q normal,low -c 4 --loglevel=info
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 使用 Celery 内置 Scheduler（定时任务静态声明），单实例运行
    # 调度状态文件写到可写的 /tmp，避免 appuser 无权限写 /app
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1               # Beat 必须单实例，禁止扩容
      resources:
        limits:
          memory: 256m

  # ── 前端 + 反向代理 ─────────────────────────────────────────────────────

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # 部分内核/Docker 组合的默认 seccomp 策略会拦截 nginx 写 pid 的 pwrite 调用（EPERM），
    # 容器内 nginx 仅做静态托管+反代，关闭 seccomp 过滤规避风险
    security_opt:
      - "seccomp=unconfined"
    ports:
      - "80:80"
      # - "443:443"     # 生产开启 HTTPS 时取消注释，并挂载证书目录
    # volumes:
    #   - ./ssl:/etc/nginx/ssl:ro   # HTTPS 证书（生产环境）
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
